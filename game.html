<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Меткий инспектор — МосВодоЭксплуатация</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#120e1f;color:#e9e4f5;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:16px}

#gate{text-align:center;max-width:340px}
#gate h1{font-size:22px;font-weight:600;margin-bottom:8px;color:#e9e4f5}
#gate p{font-size:14px;color:#9a90b8;line-height:1.5;margin-bottom:20px}
.icon-big{font-size:48px;margin-bottom:16px;display:block}
.btn-row{display:flex;gap:10px;justify-content:center}
button{padding:9px 22px;border-radius:8px;border:1px solid #3a2f5e;background:transparent;color:#e9e4f5;font-size:14px;cursor:pointer;transition:background .15s}
button:hover{background:#2a2140}
button.primary{background:linear-gradient(135deg,#a678ff,#7c4dff);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(124,77,255,.4)}
button.primary:hover{background:linear-gradient(135deg,#b18aff,#8b5cf6)}

#game-wrap{display:none;flex-direction:column;align-items:center;gap:10px}
#hud{width:520px;max-width:100%;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#9a90b8}
#hud b{color:#e9e4f5}

.topbar{width:520px;max-width:100%;display:flex;justify-content:space-between;align-items:center;padding:6px 2px 10px}
.topbar__link{color:#b09cff;text-decoration:none;font-weight:700;font-size:14px}
.topbar__link:hover{color:#d0c2ff}
.topbar__title{color:#9a90b8;font-size:13px}

canvas{border-radius:10px;border:1px solid #3a2f5e;display:block;touch-action:none}

#ui-bar{width:520px;max-width:100%;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;background:#1a1430;border:1px solid #3a2f5e;border-radius:12px;padding:12px 14px}
.ctl{flex:1;min-width:150px}
label{font-size:13px;color:#b4a8d0;display:flex;align-items:center;gap:6px;margin-bottom:8px;font-weight:700}
label .val{background:linear-gradient(135deg,#a678ff,#7c4dff);color:#fff;border-radius:6px;padding:2px 9px;font-size:13px;min-width:34px;text-align:center}
input[type=range]{width:100%;height:10px;-webkit-appearance:none;appearance:none;background:linear-gradient(90deg,#7c4dff,#b09cff);border-radius:6px;cursor:pointer;box-shadow:inset 0 1px 3px rgba(0,0,0,.45)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid #7c4dff;box-shadow:0 1px 5px rgba(0,0,0,.55)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid #7c4dff;box-shadow:0 1px 5px rgba(0,0,0,.55)}
.scale{display:flex;justify-content:space-between;font-size:11px;color:#6a5f8a;margin-top:5px;font-weight:600}
#throw-btn{padding:12px 26px;background:linear-gradient(135deg,#a678ff,#7c4dff);border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 2px 6px rgba(124,77,255,.4)}
#throw-btn:hover{background:linear-gradient(135deg,#b18aff,#8b5cf6)}
#throw-btn:disabled{background:#2a2140;color:#555;cursor:default;box-shadow:none}

#msg-bar{height:22px;font-size:14px;font-weight:500;color:#e9e4f5;text-align:center}
#restart-btn{display:none;padding:9px 22px;border-radius:8px;border:1px solid #3a2f5e;background:transparent;color:#e9e4f5;font-size:14px;cursor:pointer}
#restart-btn:hover{background:#2a2140}
</style>
</head>
<body>

<div class="topbar">
  <a class="topbar__link" href="index.html">← МосВодоЭксплуатация</a>
  <span class="topbar__title">Меткий инспектор</span>
</div>

<div id="gate">
  <span class="icon-big">🔧</span>
  <h1>Меткий инспектор</h1>
  <p>Бросьте пломбу точно на крепление счётчика. Учитывайте ветер и рассчитайте силу броска.</p>
  <div class="btn-row">
    <button class="primary" id="start-btn">Сыграть</button>
    <button id="skip-btn">Не сейчас</button>
  </div>
</div>

<div id="game-wrap">
  <div id="hud">
    <span>Уровень: <b id="lv">1</b></span>
    <span>Счёт: <b id="sc">0</b></span>
    <span>Идеально: <b id="st">☆☆☆☆☆</b></span>
    <span>Ветер: <b id="wd">—</b></span>
    <span>Попыток: <b id="at">3</b></span>
  </div>
  <canvas id="c" width="480" height="360"></canvas>
  <div id="msg-bar"></div>
  <div id="ui-bar">
    <div id="angle-wrap" class="ctl">
      <label for="angle">Угол броска <span class="val" id="av">45</span>°</label>
      <input type="range" id="angle" min="10" max="80" value="45" step="1">
      <div class="scale"><span>10°</span><span>80°</span></div>
    </div>
    <div id="power-wrap" class="ctl">
      <label for="power">Сила <span class="val" id="pv">50</span>%</label>
      <input type="range" id="power" min="20" max="100" value="50" step="1">
      <div class="scale"><span>20%</span><span>100%</span></div>
    </div>
    <button id="throw-btn">Бросить</button>
  </div>
  <button id="restart-btn">Следующий уровень</button>
</div>

<script>
const gate=document.getElementById('gate');
const gw=document.getElementById('game-wrap');
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const W=480,H=360;

const lvEl=document.getElementById('lv');
const scEl=document.getElementById('sc');
const stEl=document.getElementById('st');
const wdEl=document.getElementById('wd');
const atEl=document.getElementById('at');
const msgEl=document.getElementById('msg-bar');
const throwBtn=document.getElementById('throw-btn');
const restartBtn=document.getElementById('restart-btn');
const angleIn=document.getElementById('angle');
const powerIn=document.getElementById('power');
const avEl=document.getElementById('av');
const pvEl=document.getElementById('pv');

document.getElementById('start-btn').onclick=()=>{gate.style.display='none';gw.style.display='flex';startLevel();};
document.getElementById('skip-btn').onclick=()=>{gate.style.display='none';};
angleIn.oninput=()=>{avEl.textContent=angleIn.value;if(!flying)draw();};
powerIn.oninput=()=>{pvEl.textContent=powerIn.value;if(!flying)draw();};

let score=0,level=1,attempts=3,flying=false,raf=null;
let seal={x:0,y:0,vx:0,vy:0,r:8};
let target={x:0,y:0,w:24,h:10};
let wind=0;
let trailPts=[];
let boom=null;
let sealLanded=false;
let levelStars=0;
let perfectRewards=[];

const LEVELS=[
  {wind:0,targetX:0.72,targetY:0.38},
  {wind:0.04,targetX:0.68,targetY:0.32},
  {wind:-0.05,targetX:0.75,targetY:0.44},
  {wind:0.07,targetX:0.65,targetY:0.28},
  {wind:-0.08,targetX:0.78,targetY:0.35},
];

function levelConf(){return LEVELS[Math.min(level-1,LEVELS.length-1)];}

function startLevel(){
  if(level>LEVELS.length){
    const ideal=perfectRewards.filter(Boolean).length;
    msgEl.textContent='Все уровни пройдены! Счёт: '+score+' · Идеально на '+ideal+' из '+LEVELS.length;
    msgEl.style.color='#b09cff';
    restartBtn.style.display='block';
    restartBtn.textContent='Сыграть заново от 1 уровня';
    restartBtn.onclick=()=>{score=0;perfectRewards=[];level=1;startLevel();};
    throwBtn.disabled=true;
    return;
  }
  const conf=levelConf();
  wind=conf.wind+(Math.random()-0.5)*0.02;
  target.x=W*conf.targetX;
  target.y=H*conf.targetY;
  attempts=3;
  levelStars=0;
  flying=false;sealLanded=false;
  trailPts=[];boom=null;
  resetSeal();
  updateHUD();
  throwBtn.disabled=false;
  restartBtn.style.display='none';
  msgEl.textContent='';
  draw();
}

function resetSeal(){
  seal.x=44;seal.y=H-60;
  seal.vx=0;seal.vy=0;
}

function updateHUD(){
  lvEl.textContent=level;
  scEl.textContent=score;
  atEl.textContent=attempts;
  const s='★'.repeat(perfectRewards.filter(Boolean).length)+'☆'.repeat(LEVELS.length-perfectRewards.filter(Boolean).length);
  stEl.textContent=s;
  const wStr=wind===0?'нет':((wind>0?'+':'')+Math.round(wind*100)+'%');
  wdEl.textContent=wStr;
}

function launch(){
  if(flying||sealLanded)return;
  const a=parseInt(angleIn.value)*Math.PI/180;
  const p=parseInt(powerIn.value)/100;
  const spd=p*14;
  seal.vx=Math.cos(a)*spd;
  seal.vy=-Math.sin(a)*spd;
  trailPts=[[seal.x,seal.y]];
  flying=true;
  throwBtn.disabled=true;
  boom=null;
  animate();
}

throwBtn.onclick=launch;
restartBtn.onclick=()=>{level++;startLevel();};

function animate(){
  if(!flying)return;
  const G=0.32;
  seal.vy+=G;
  seal.vx+=wind;
  seal.x+=seal.vx;
  seal.y+=seal.vy;
  trailPts.push([seal.x,seal.y]);
  if(trailPts.length>40)trailPts.shift();

  const hit=Math.abs(seal.x-target.x)<target.w/2+seal.r&&Math.abs(seal.y-target.y)<target.h/2+seal.r;
  if(hit){
    flying=false;sealLanded=true;
    const dist=Math.hypot(seal.x-target.x,seal.y-target.y);
    const perfect=dist<10;
    let pts=perfect?100:60;
    let stars=perfect?2:1;
    if(dist<4)stars=3;
    score+=pts;
    levelStars=Math.max(levelStars,stars);
    if(stars===3&&!perfectRewards[level-1]){perfectRewards[level-1]=true;}
    boom={x:seal.x,y:seal.y,ok:true,t:0};
    msgEl.textContent=(stars===3?'Идеально! +'+pts+' ★':'Попал! +'+pts);
    msgEl.style.color=stars===3?'#b09cff':'#9bd0ff';
    updateHUD();
    draw();
    setTimeout(()=>{restartBtn.style.display='block';restartBtn.textContent='Уровень '+(level+1)+' →';},700);
    return;
  }

  if(seal.y>H+20||seal.x>W+20||seal.x<-20){
    flying=false;
    attempts--;
    boom={x:Math.min(Math.max(seal.x,10),W-10),y:Math.min(seal.y,H-10),ok:false,t:0};
    updateHUD();
    if(attempts<=0){
      msgEl.textContent='Попытки кончились. Уровень заново.';
      msgEl.style.color='#e05560';
      draw();
      setTimeout(()=>{
        restartBtn.style.display='block';
        restartBtn.textContent='Попробовать снова';
        restartBtn.onclick=()=>{attempts=3;flying=false;sealLanded=false;trailPts=[];boom=null;resetSeal();updateHUD();throwBtn.disabled=false;restartBtn.style.display='none';msgEl.textContent='';draw();};
      },600);
    } else {
      msgEl.textContent='Мимо! Осталось попыток: '+attempts;
      msgEl.style.color='#e09050';
      draw();
      setTimeout(()=>{resetSeal();flying=false;trailPts=[];boom=null;throwBtn.disabled=false;draw();},700);
    }
    return;
  }
  draw();
  raf=requestAnimationFrame(animate);
}

function drawMeter(){
  const mx=target.x,my=target.y;
  ctx.fillStyle='#3f3560';
  ctx.fillRect(mx-30,my-20,60,48);
  ctx.fillStyle='#2c2448';
  ctx.fillRect(mx-24,my-14,48,28);
  ctx.strokeStyle='#b09cff';ctx.lineWidth=1;
  ctx.strokeRect(mx-24,my-14,48,28);
  ctx.fillStyle='#3a2f5e';
  ctx.fillRect(mx-18,my-8,36,16);
  ctx.fillStyle='#b09cff';ctx.font='bold 9px sans-serif';ctx.textAlign='center';
  ctx.fillText('м³',mx,my+4);
  ctx.fillStyle='#8a7faa';
  ctx.fillRect(mx-4,my+28,8,10);
  ctx.fillRect(mx-14,my+36,28,6);
  ctx.fillStyle='#b4a8d0';
  ctx.font='10px sans-serif';ctx.textAlign='center';
  ctx.fillText('ИВК-201',mx,my+64);

  const cols=['#8b8f98','#c8ccd4','#8b8f98'];
  cols.forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(target.x-target.w/2+i*10,target.y-target.h/2-5,8,3);});
  ctx.fillStyle='#ffd75e';
  ctx.fillRect(target.x-target.w/2,target.y-target.h/2,target.w,target.h);
  ctx.strokeStyle='#e8b84a';ctx.lineWidth=1;
  ctx.strokeRect(target.x-target.w/2,target.y-target.h/2,target.w,target.h);
  ctx.fillStyle='#3a2a00';ctx.font='bold 7px sans-serif';ctx.textAlign='center';
  ctx.fillText('ПЛОМБА',target.x,target.y+3);
}

function drawWall(){
  ctx.fillStyle='#241c3c';
  ctx.fillRect(W*0.55,0,W*0.45,H);
  ctx.strokeStyle='#322a52';ctx.lineWidth=1;
  for(let y=20;y<H;y+=30){
    for(let x=Math.ceil(W*0.55/80)*80;x<W;x+=80){
      ctx.strokeRect(x+(y%60<30?0:40),y,78,28);
    }
  }
  ctx.strokeStyle='#2a2140';
  for(let y=20;y<H;y+=30)ctx.strokeRect(W*0.55,y,W,28);
}

function drawPerson(){
  const px=44,py=H-60;
  ctx.fillStyle='#f2f5f9';
  ctx.beginPath();ctx.arc(px,py-32,11,Math.PI,0);ctx.closePath();ctx.fill();
  ctx.fillStyle='#9fb4d9';
  ctx.beginPath();ctx.arc(px,py-32,11,Math.PI*0.82,Math.PI*1.18);ctx.closePath();ctx.fill();
  ctx.fillStyle='#d9e2ee';
  ctx.fillRect(px+3,py-27,9,3);
  ctx.fillStyle='#b9c8de';
  ctx.fillRect(px-13,py-33,26,3);
  ctx.fillStyle='#e0b48a';
  ctx.beginPath();ctx.arc(px,py-23,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#7c4dff';
  ctx.beginPath();
  ctx.moveTo(px-11,py-14);ctx.lineTo(px+11,py-14);
  ctx.lineTo(px+9,py+4);ctx.lineTo(px-9,py+4);ctx.closePath();ctx.fill();
  ctx.fillRect(px-12,py-13,4,16);ctx.fillRect(px+8,py-13,4,16);
  ctx.fillRect(px-10,py+4,8,18);ctx.fillRect(px+2,py+4,8,18);
  ctx.fillStyle='#a678ff';
  ctx.fillRect(px-9,py-2,18,3);
  ctx.strokeStyle='#6a3dd0';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(px,py-14);ctx.lineTo(px,py+4);ctx.stroke();
  ctx.fillStyle='#a678ff';
  ctx.beginPath();ctx.arc(px+4,py-8,3.6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 4px sans-serif';ctx.textAlign='center';
  ctx.fillText('МВЭ',px+4,py-6.4);
  if(!flying&&!sealLanded){
    const a=parseInt(angleIn.value)*Math.PI/180;
    const arm=18;
    ctx.strokeStyle='#a678ff';ctx.lineWidth=4;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(px+6,py-12);ctx.lineTo(px+6+Math.cos(a)*arm,py-12-Math.sin(a)*arm);ctx.stroke();
    ctx.fillStyle='#ffd75e';
    ctx.beginPath();ctx.arc(px+6+Math.cos(a)*arm,py-12-Math.sin(a)*arm,seal.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#e8b84a';ctx.lineWidth=1;ctx.stroke();
  }
}

function drawSeal(){
  if(flying||sealLanded){
    ctx.fillStyle='#ffd75e';
    ctx.beginPath();ctx.arc(seal.x,seal.y,seal.r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#e8b84a';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='#3a2a00';ctx.font='bold 6px sans-serif';ctx.textAlign='center';
    ctx.fillText('П',seal.x,seal.y+2);
  }
}

function drawTrail(){
  if(trailPts.length<2)return;
  ctx.strokeStyle='rgba(255,215,94,0.35)';ctx.lineWidth=2;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(trailPts[0][0],trailPts[0][1]);
  for(let i=1;i<trailPts.length;i++)ctx.lineTo(trailPts[i][0],trailPts[i][1]);
  ctx.stroke();ctx.setLineDash([]);
}

function drawAimGuide(){
  if(flying||sealLanded)return;
  const a=parseInt(angleIn.value)*Math.PI/180;
  const p=parseInt(powerIn.value)/100;
  let sx=seal.x,sy=seal.y;
  let vx2=Math.cos(a)*p*14,vy2=-Math.sin(a)*p*14;
  ctx.strokeStyle='rgba(176,156,255,0.55)';ctx.lineWidth=2;ctx.setLineDash([4,6]);
  ctx.beginPath();ctx.moveTo(sx,sy);
  for(let i=0;i<80;i++){
    vy2+=0.32;vx2+=wind;sx+=vx2;sy+=vy2;
    if(sy>H||sx>W)break;
    ctx.lineTo(sx,sy);
    if(i%6===0){
      ctx.fillStyle='rgba(255,215,94,0.7)';
      ctx.beginPath();ctx.arc(sx,sy,1.8,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.stroke();ctx.setLineDash([]);
  const endX=sx,endY=sy;
  ctx.strokeStyle='rgba(255,215,94,0.85)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(endX,endY,7,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle='rgba(255,215,94,0.35)';
  ctx.beginPath();ctx.arc(endX,endY,12,0,Math.PI*2);ctx.stroke();
}

function drawWindArrow(){
  if(Math.abs(wind)<0.001)return;
  const cx=W/2,cy=18;
  const len=Math.min(Math.abs(wind)*400,50);
  const dir=wind>0?1:-1;
  ctx.strokeStyle='#b09cff';ctx.lineWidth=2;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx-dir*len/2,cy);ctx.lineTo(cx+dir*len/2,cy);ctx.stroke();
  ctx.fillStyle='#b09cff';
  ctx.beginPath();
  const ax=cx+dir*len/2;
  ctx.moveTo(ax,cy);ctx.lineTo(ax-dir*8,cy-5);ctx.lineTo(ax-dir*8,cy+5);ctx.closePath();ctx.fill();
  ctx.fillStyle='#b4a8d0';ctx.font='11px sans-serif';ctx.textAlign='center';
  ctx.fillText('ветер',cx,cy+22);
}

function drawBoom(){
  if(!boom)return;
  boom.t++;
  const r=boom.t*3;
  ctx.strokeStyle=boom.ok?'rgba(176,156,255,'+Math.max(0,1-boom.t/20)+')':'rgba(224,85,96,'+Math.max(0,1-boom.t/20)+')';
  ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(boom.x,boom.y,r,0,Math.PI*2);ctx.stroke();
}

function drawFloor(){
  ctx.fillStyle='#1a1430';
  ctx.fillRect(0,H-30,W*0.56,30);
  ctx.fillStyle='#241c3c';
  ctx.fillRect(0,H-8,W*0.56,8);
}

function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#181230');
  g.addColorStop(1,'#120e1f');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(166,120,255,0.12)';
  ctx.beginPath();ctx.arc(150,120,46,0,Math.PI*2);ctx.fill();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  drawBg();
  drawWall();
  drawFloor();
  drawWindArrow();
  drawMeter();
  drawAimGuide();
  drawTrail();
  drawSeal();
  drawPerson();
  if(boom)drawBoom();
}

draw();
</script>
</body>
</html>
